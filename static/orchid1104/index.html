<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f6efe0">
  <meta name="description" content="Орхидея № 1104 — жива хербарийна страница за мама. Честит рожден ден!">
  <meta property="og:title" content="Орхидея № 1104 — за мама">
  <meta property="og:description" content="Жива хербарийна страница с орхидея и пожелание за рождения ден на мама.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.ivaniliev.online/orchid1104/">
  <meta property="og:image" content="https://www.ivaniliev.online/orchid1104/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <title>Орхидея № 1104 — за мама</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-day">
  <div class="page">
    <header class="masthead">
      <p class="eyebrow">ХЕРБАРИЙ <span aria-hidden="true">·</span> № 1104</p>
      <p class="date">4 НОЕМВРИ 2026</p>
    </header>

    <main class="stage-wrap">
      <figure class="plate" aria-labelledby="plate-caption">
        <span class="tick tick-tl" aria-hidden="true"></span>
        <span class="tick tick-tr" aria-hidden="true"></span>
        <span class="tick tick-bl" aria-hidden="true"></span>
        <span class="tick tick-br" aria-hidden="true"></span>
        <canvas id="scene" role="img" aria-label="ASCII портрет на цъфтяща орхидея Phalaenopsis в саксия. Три отворени цвята, две пъпки и широки листа. Плъзнете, за да завъртите растението."></canvas>
        <figcaption id="plate-caption" class="specimen">
          <span class="latin">Phalaenopsis × hybrida</span>
          <span class="plate-meta">ASCII · 96 × 60</span>
        </figcaption>
      </figure>
    </main>

    <section class="dedication" aria-label="Поздрав">
      <p class="prelude" aria-hidden="true">за мама</p>
      <p class="wish-line line-1">Честит рожден ден, мамо!</p>
      <p class="wish-line line-2">Много те обичам и страшно много ми липсваш.</p>
      <p class="wish-line line-3">Нямам търпение да се видим <span class="heart">&lt;3</span></p>
      <p class="signature">от Ванко</p>
    </section>

    <footer class="colophon">
      <div class="controls" role="group" aria-label="Контроли">
        <button type="button" id="replay">[ replay ]</button>
        <button type="button" id="theme" aria-pressed="false">[ night ]</button>
        <button type="button" id="camera" class="camera" hidden>[ full plant ]</button>
        <span class="hint" id="hint">drag to turn</span>
      </div>
      <p class="footer-note">жива хербарийна страница</p>
    </footer>
  </div>

  <div class="sr-only" id="static-art" aria-hidden="true"></div>

  <noscript>
    <div class="noscript">
      <p>Честит рожден ден, мамо!</p>
      <p>Много те обичам и страшно много ми липсваш.</p>
      <p>Нямам търпение да се видим &lt;3</p>
      <p>от Ванко</p>
    </div>
  </noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
