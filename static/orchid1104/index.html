<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="orchid-version" content="6">
  <meta name="theme-color" content="#f6efe0">
  <meta name="description" content="Orchid No. 1104 — a living herbarium page for Mom. Happy birthday!">
  <meta property="og:title" content="Orchid No. 1104 — for Mom">
  <meta property="og:description" content="A living herbarium page with an ASCII orchid and a birthday wish for Mom.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.ivaniliev.online/orchid1104/">
  <meta property="og:image" content="https://www.ivaniliev.online/orchid1104/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <title>Orchid No. 1104 — for Mom</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-day">
  <canvas id="ambient" aria-hidden="true"></canvas>
  <div class="page">
    <header class="masthead">
      <p class="eyebrow">HERBARIUM <span aria-hidden="true">·</span> No. 1104</p>
      <p class="date" lang="bg">4 НОЕМВРИ 2026</p>
    </header>

    <main class="stage-wrap">
      <figure class="plate" aria-labelledby="plate-caption">
        <span class="tick tick-tl" aria-hidden="true"></span>
        <span class="tick tick-tr" aria-hidden="true"></span>
        <span class="tick tick-bl" aria-hidden="true"></span>
        <span class="tick tick-br" aria-hidden="true"></span>
        <canvas id="scene" role="img" aria-label="ASCII portrait of a flowering Phalaenopsis orchid in a pot. Three open flowers, three buds and broad leaves. Drag to turn the plant."></canvas>
        <figcaption id="plate-caption" class="specimen">
          <span class="latin">Phalaenopsis × hybrida</span>
          <span class="plate-meta">ASCII · 160 × 100</span>
        </figcaption>
      </figure>
    </main>

    <section class="dedication" lang="bg" aria-label="Поздрав">
      <p class="prelude" aria-hidden="true">за мама</p>
      <div class="tag-body">
        <p class="wish-line line-1">Честит рожден ден, мамо!</p>
        <p class="wish-line line-2">Много те обичам и страшно много ми липсваш.</p>
        <p class="wish-line line-3">Нямам търпение да се видим <span class="heart">&lt;3</span></p>
        <p class="signature">от Ванко</p>
      </div>
    </section>

    <footer class="colophon">
      <div class="controls" role="group" aria-label="Controls">
        <button type="button" id="replay">[ replay ]</button>
        <button type="button" id="theme" aria-pressed="false">[ night ]</button>
        <button type="button" id="camera" class="camera" hidden>[ full plant ]</button>
        <span class="hint" id="hint">drag to turn</span>
      </div>
      <p class="footer-note">a living herbarium page</p>
    </footer>
  </div>

  <div class="sr-only" id="static-art" aria-hidden="true"></div>

  <noscript>
    <div class="noscript" lang="bg">
      <p>Честит рожден ден, мамо!</p>
      <p>Много те обичам и страшно много ми липсваш.</p>
      <p>Нямам търпение да се видим &lt;3</p>
      <p>от Ванко</p>
    </div>
  </noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
